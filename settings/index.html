<!DOCTYPE html>
<html lang="en" data-theme="material">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="generator" content="3.0.0">
	<meta name="title" content="Elements">
	<meta name="author" content="eccs0103">
	<meta name="color-scheme" content="system">
	<meta name="description" content="Settings of the game">
	<meta name="keywords" content="game, duel, elements, simulation, cellular automaton">
	<meta name="robots" content="index, follow">
	<meta name="language" content="English">
	<meta name="revisit-after" content="0 days">
	<title>Settings - Elements</title>
	<link rel="shortcut icon" href="../assets/icons/gear.svg" media="(prefers-color-scheme: light)">
	<link rel="shortcut icon" href="../assets/icons/gear-inverted.svg" media="(prefers-color-scheme: dark)">
	<link rel="stylesheet" href="../styles/global.css">
	<link rel="stylesheet" href="../styles/themes/material.css">
	<link rel="stylesheet" href="../playground/view/layout.css">
	<link rel="stylesheet" href="./view/style.css">
	<script type="module" src="../environment/services/analytics-service.ts"></script>
	<script type="module" src="./controllers/settings-controller.ts"></script>
</head>

<body>
	<nav class="layer rounded with-gap with-padding flex center">
		<a href="../playground/" role="combobox" title="Playground" class="icon-playground flex rounded with-padding">
			<span class="icon">Playground</span>
		</a>
		<a href="../settings/" role="combobox" aria-checked="true" title="Settings" class="icon-settings flex rounded with-padding">
			<span class="icon">Settings</span>
		</a>
	</nav>
	<main class="flex main-center">
		<div class="panel flex column with-gap with-padding large-padding">
			<div class="layer rounded flex column with-padding large-padding">
				<h3>General</h3>
				<section class="option">
					<p class="title">Color scheme</p>
					<select id="scheme" class="value depth rounded with-padding flex" required>
						<option value="system">System</option>
						<option value="light">Light</option>
						<option value="dark">Dark</option>
					</select>
					<dfn class="definition">External design of the page: color scheme, background and foreground, font.</dfn>
				</section>
			</div>
			<div id="deck" class="layer rounded flex column with-padding large-padding">
				<header class="layer flex column">
					<h3 class="flex">Deck<span id="count" class="description"></span></h3>
					<span id="hint" class="description"></span>
					<ol id="slots" class="with-gap"></ol>
				</header>
				<div id="collection" class="flex column with-gap large-gap"></div>
			</div>
		</div>
	</main>
	<dialog id="details" class="layer rounded" aria-labelledby="details-name">
		<div class="flex column with-gap large-gap with-padding large-padding">
			<header class="flex alt-center with-gap">
				<button type="button" class="back icon-button rounded flex center" title="Back" aria-label="Back">
					<span class="icon"></span>
				</button>
				<span class="tile rounded"></span>
				<div class="title flex column">
					<h2 id="details-name" class="name"></h2>
					<span class="phase description"></span>
				</div>
				<button type="button" class="close icon-button rounded flex center" title="Close" aria-label="Close">
					<span class="icon"></span>
				</button>
			</header>
			<ul class="traits flex wrap with-gap"></ul>
			<figure class="demo flex column with-gap">
				<canvas class="board depth rounded"></canvas>
				<figcaption class="flex alt-center with-gap">
					<span class="versus"></span>
					<button type="button" class="open highlight">Open</button>
				</figcaption>
			</figure>
			<section class="acts flex column with-gap">
				<h3>What it does</h3>
				<ol class="rows flex column with-gap"></ol>
			</section>
			<section class="threats flex column with-gap">
				<h3>What stops it</h3>
				<ol class="rows flex column with-gap"></ol>
			</section>
			<footer class="flex column with-gap">
				<button type="button" class="toggle rounded with-padding"></button>
			</footer>
		</div>
	</dialog>
	<template id="slot">
		<li>
			<button type="button" class="card slot depth rounded flex column center with-padding">
				<span class="tile rounded"></span>
				<span class="name font-smaller-3"></span>
			</button>
		</li>
	</template>
	<template id="card">
		<li>
			<button type="button" class="card depth rounded flex column center with-padding">
				<span class="tile rounded"></span>
				<span class="name font-smaller-3"></span>
				<span class="marks flex center with-gap small-gap">
					<span class="icon flammable" title="Flammable"></span>
					<span class="icon conductive" title="Conducts"></span>
				</span>
			</button>
		</li>
	</template>
	<template id="row">
		<li class="row flex column">
			<span class="when description font-smaller-4"></span>
			<p class="sentence flex wrap alt-center with-gap small-gap"></p>
			<span class="summary description font-smaller-4"></span>
		</li>
	</template>
	<template id="chip">
		<button type="button" class="chip depth rounded flex alt-center with-gap small-gap">
			<span class="tile rounded"></span>
			<span class="name font-smaller-3"></span>
		</button>
	</template>
	<span class="ghost rounded" hidden></span>
</body>

</html>
