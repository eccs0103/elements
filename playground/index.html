<!DOCTYPE html>
<html lang="en" data-theme="material">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="generator" content="3.0.0">
	<meta name="title" content="Elements">
	<meta name="author" content="eccs0103">
	<meta name="color-scheme" content="system">
	<meta name="description" content="A duel of elements on a living board">
	<meta name="keywords" content="game, duel, elements, simulation, cellular automaton">
	<meta name="robots" content="index, follow">
	<meta name="language" content="English">
	<meta name="revisit-after" content="0 days">
	<title>Playground - Elements</title>
	<link rel="shortcut icon" href="../assets/icons/cubes.svg" media="(prefers-color-scheme: light)">
	<link rel="shortcut icon" href="../assets/icons/cubes-inverted.svg" media="(prefers-color-scheme: dark)">
	<link rel="stylesheet" href="../styles/global.css">
	<link rel="stylesheet" href="../styles/themes/material.css">
	<link rel="stylesheet" href="../playground/view/layout.css">
	<link rel="stylesheet" href="./view/style.css">
	<script type="module" src="../environment/services/analytics-service.ts"></script>
	<script type="module" src="./controllers/playground-controller.ts"></script>
</head>

<body>
	<nav class="layer rounded with-gap with-padding flex center">
		<a href="../playground/" role="combobox" aria-checked="true" title="Playground" class="icon-playground flex rounded with-padding">
			<span class="icon">Playground</span>
		</a>
		<a href="../settings/" role="combobox" title="Settings" class="icon-settings flex rounded with-padding">
			<span class="icon">Settings</span>
		</a>
	</nav>
	<main>
		<div id="stage">
			<canvas id="board"></canvas>
			<div id="crosshair" hidden>
				<span class="row"></span>
				<span class="column"></span>
				<span class="cell"></span>
			</div>
			<section id="peek" class="layer rounded flex column with-gap with-padding large-padding" hidden>
				<header class="flex alt-center with-gap">
					<span id="tile" class="tile rounded"></span>
					<div class="flex column">
						<h3 id="title"></h3>
						<span id="about" class="description font-smaller-2"></span>
					</div>
				</header>
				<ul id="traits" class="flex wrap with-gap small-gap"></ul>
				<h4>Does</h4>
				<ol id="acts" class="flex column with-gap"></ol>
				<h4>Stopped by</h4>
				<div id="stoppers" class="flex wrap alt-center with-gap small-gap"></div>
			</section>
			<div id="toolkit" class="flex">
				<div id="hand" class="flex"></div>
			</div>
		</div>
	</main>
	<template id="line">
		<li class="flex column">
			<header class="description font-smaller-3"></header>
			<p class="flex wrap alt-center with-gap small-gap"></p>
		</li>
	</template>
	<template id="chip">
		<span class="chip flex alt-center with-gap small-gap">
			<span class="tile rounded"></span>
			<span class="name font-smaller-2"></span>
		</span>
	</template>
</body>

</html>
